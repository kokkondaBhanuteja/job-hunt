server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: unknown paths serve index.html so the hash router handles them
    location / {
        try_files $uri /index.html;
    }

    # Proxy API calls to the backend container — keeps the browser same-origin (no CORS needed)
    location /api/ {
        proxy_pass         http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Also proxy the unauthenticated health endpoint
    location /health {
        proxy_pass         http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}
