[project]
name = "job-hunt"
version = "0.1.0"
description = "Personal job-hunt automation — discover jobs, score them locally with Ollama, drive from any MCP host."
requires-python = ">=3.12"
dependencies = [
    "apscheduler>=3.11.3",
    "fastapi>=0.138.2",
    "httpx>=0.28.1",
    "mcp[cli]>=1.27.2",
    "pdfplumber>=0.11.9",
    "playwright>=1.60.0",
    "playwright-stealth>=2.0.3",
    "psycopg[binary]>=3.3.4",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.3",
    "uvicorn[standard]>=0.49.0",
]

[project.scripts]
hunt = "job_hunt.cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["job_hunt"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
